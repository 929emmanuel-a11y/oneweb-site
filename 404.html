<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>One Web</title>
<script>
// Short links in our texts: onewebonline.com/s/<site> opens that site (carriers block texts with our long subdomain links).
(function () {
  var m = location.pathname.match(/^\/s\/([a-z0-9-]{3,60})\/?$/i);
  if (m) location.replace('https://' + m[1].toLowerCase() + '.onewebonline.com/' + location.search);
})();
</script>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #0b0b0d; color: #f2f3f3; display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  a { color: #f2f3f3; }
</style>
</head>
<body>
  <div>
    <p>Opening your site…</p>
    <p style="opacity:.7;font-size:14px">Not loading? <a href="https://onewebonline.com/">Go to One Web</a></p>
  </div>
</body>
</html>
