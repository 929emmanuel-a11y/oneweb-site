<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>One Web — Studio Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#121211;--bg3:#1a1a18;--line:rgba(237,232,224,.10);--txt:#ede8e0;--mut:#9b958c;--gold:#c9a86a;--gold2:#e6cf9e;--ok:#7bc47f;--warn:#e0a458;--bad:#e06c6c;--serif:"Instrument Serif",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.app>div{min-width:0}
aside{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--serif);font-size:26px;margin:0 8px 22px}.brand span{color:var(--gold)}
.tab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);border:0;background:none;text-align:left;width:100%}
.tab:hover{color:var(--txt);background:var(--bg2)}.tab.on{color:var(--txt);background:var(--bg3)}
.tab i{width:7px;height:7px;border-radius:50%;background:var(--line)}.tab.on i{background:var(--gold)}
aside .grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:16px 12px 4px;opacity:.8}.mtabs .grp{display:none}
aside .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:0 8px}
main{padding:32px clamp(16px,4vw,48px);max-width:1200px;width:100%}
h1{font-family:var(--serif);font-weight:400;font-size:44px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 28px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1}.kpi span{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:170px 1fr 60px;gap:14px;align-items:center}
.frow .bar{height:12px;background:var(--bg3);border-radius:99px;overflow:hidden}.frow .bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.frow .soon{color:var(--mut);font-size:12px}
.frow.dim{opacity:.45}
label{display:block;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:16px}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--gold)}.range small{color:var(--mut);width:70px;font-size:12px}.range small:last-child{text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle input{width:42px;height:22px;accent-color:var(--gold)}
.btn{border:0;border-radius:99px;padding:10px 20px;cursor:pointer;font-weight:600}
.btn-gold{background:var(--gold);color:#0a0a0a}.btn-gold:hover{background:var(--gold2)}
.btn-line{background:none;border:1px solid var(--line)}.btn-line:hover{border-color:var(--gold)}
.btn-sm{padding:6px 12px;font-size:12px}
.rules .rule{display:flex;gap:8px;margin-bottom:8px}.rules .rule input{flex:1}
.savebar{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:10px}
.savebar span{color:var(--mut);font-size:13px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pill.preview_requested{color:var(--gold2)}.pill.ready_to_pay,.pill.won{color:var(--ok)}.pill.needs_human{color:var(--warn)}.pill.lost,.pill.opted_out{color:var(--bad)}
.convos{display:grid;grid-template-columns:320px 1fr;gap:18px}
.clist{max-height:70vh;overflow:auto}
.citem{padding:12px;border-radius:10px;cursor:pointer;border:1px solid transparent}.citem:hover{background:var(--bg3)}.citem.on{border-color:var(--gold)}
.citem b{display:block}.citem small{color:var(--mut)}
.thread{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;padding:4px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.msg.user{align-self:flex-start;background:var(--bg3);border-bottom-left-radius:4px}
.msg.assistant{align-self:flex-end;background:#2a2417;color:#f3e7cf;border-bottom-right-radius:4px}
.msg small{display:block;opacity:.55;font-size:10px;margin-top:4px}
.meta{font-size:12px;color:var(--mut);margin:6px 0 0}
.chatbox{display:flex;gap:10px;margin-top:14px}.chatbox input{flex:1}
.empty{color:var(--mut);padding:30px;text-align:center}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.hide{display:none!important}
.bubble{background:#2a2417;color:#f3e7cf;padding:14px 16px;border-radius:18px;border-bottom-left-radius:4px;white-space:pre-wrap;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mtabs{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}aside{display:none}
 .mtabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
 .mtabs .tab{white-space:nowrap;width:auto}
 .g2,.g3,.g4,.convos{grid-template-columns:1fr}.g4.kpis{grid-template-columns:1fr 1fr}
 .frow{grid-template-columns:120px 1fr 40px}
 main{padding:20px 16px}h1{font-size:34px}
}
</style>
</head>
<body>

<div id="login" class="login hide">
  <div class="brand">One Web<span>.</span></div>
  <div class="card">
    <h2>Studio sign in</h2>
    <p class="sub" style="margin-bottom:18px">Username <b>emmanuel</b> and the password you set in n8n.</p>
    <div class="field"><label>Username</label><input type="text" id="lu" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="lp" autocomplete="current-password"></div>
    <div class="toggle" style="border:0;padding-top:0"><span>Remember on this device</span><input type="checkbox" id="lr"></div>
    <div class="err" id="lerr"></div>
    <button class="btn btn-gold" id="lbtn" style="width:100%">Sign in</button>
  </div>
</div>

<div id="app" class="app hide">
  <aside>
    <div class="brand">One Web<span>.</span></div>
    <nav id="nav"></nav>
    <div class="foot"><div id="synced">—</div><button class="btn btn-line btn-sm" id="logout" style="margin-top:10px">Sign out</button></div>
  </aside>
  <div>
    <div class="mtabs" id="mnav"></div>
    <main id="main"></main>
  </div>
</div>

<script>
const API = 'https://n8n-production-9be3db1c.up.railway.app/webhook/oneweb-api';
const CHAT = 'https://n8n-production-9be3db1c.up.railway.app/webhook/oneweb-test-chat-b3a761a6';
const DIAL = 'https://n8n-production-9be3db1c.up.railway.app/webhook/oneweb-dialer-stats';
let DSTATS = null, SITEBK = [], CLIENTS = [];
const EDIT = 'https://n8n-production-9be3db1c.up.railway.app/webhook/oneweb-preview-edit';
// Sidebar groups. Keys map to the view functions below.
const NAVG = [
  ['', [['overview','Overview']]],
  ['Sales', [['convos','Conversations'],['bookings','Sales calls'],['results','Call results']]],
  ['Communication', [['voice','AI caller & dialer'],['closer','AI texter (closer)'],['pricing','Pricing & offers'],['test','Test chat']]],
  ['Clients', [['clients','Clients'],['reviews','Testimonials']]]];
const TABS = NAVG.flatMap(g => g[1]);
let AUTH = null, STATE = null, TAB = 'overview', DRAFT = null, SEL = null, DIRTY = false;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago = t => { if (!t) return '—'; const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s/60)+'m ago' : s < 86400 ? Math.floor(s/3600)+'h ago' : Math.floor(s/86400)+'d ago'; };
const store = { get(k){ try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v,remember){ try { (remember ? localStorage : sessionStorage).setItem(k,v); } catch(e){} },
  clear(k){ try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch(e){} } };

async function call(url, body){
  const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Basic '+AUTH }, body: JSON.stringify(body) });
  if (r.status === 401 || r.status === 403) { const e = new Error('auth'); e.auth = true; throw e; }
  if (!r.ok) throw new Error('Server error '+r.status);
  return r.json();
}
async function load(op='state', extra={}){
  STATE = await call(API, Object.assign({ op }, extra));
  try { DSTATS = await call(DIAL, {}); } catch (e) { if (e.auth) throw e; }
  try { SITEBK = (await call(EDIT, { op: 'site_bookings' })).bookings || []; } catch (e) {}
  try { CLIENTS = (await call(EDIT, { op: 'clients' })).clients || []; } catch (e) {}
  if (!DIRTY) DRAFT = JSON.parse(JSON.stringify(STATE.settings));
  $('#synced').textContent = 'Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  render();
}

function nav(){
  const h = NAVG.map(([g, items]) => (g ? `<div class="grp">${g}</div>` : '') + items.map(([k,l]) => `<button class="tab ${TAB===k?'on':''}" data-t="${k}"><i></i>${l}</button>`).join('')).join('');
  $('#nav').innerHTML = h; $('#mnav').innerHTML = h;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TAB = b.dataset.t; render(); });
}
function render(){ nav(); const f = { overview, convos, closer, pricing, reviews, bookings, results, clients, voice, test }[TAB]; $('#main').innerHTML = f(); bind(); }

function dialToday(){
  const d = DSTATS || {}, t = d.today || {}, o = (d.outcomes || {})[t.date] || {};
  return { dialed: t.dialed || 0, voicemail: o.voicemail || 0, human: o.human || 0, unsure: o.unsure || 0, noAnswer: o.noAnswer || 0,
    busy: o.busy || 0, failed: o.failed || 0, inbound: o.inbound || 0, avg: o.ended ? Math.round((o.talkSec || 0) / o.ended) : 0 };
}
function dialStatus(){
  const d = (STATE.settings || {}).dialer || {};
  if (!d.enabled) return ['Off', ''];
  if (!d.connectionId || !(STATE.settings.ourNumbers || []).length) return ['Needs setup', 'needs_human'];
  return ['On', 'ready_to_pay'];
}
function overview(){
  const p = STATE.pipeline, s = STATE.settings;
  const rows = [
    ['Leads scraped', (STATE.leads||{}).scraped || null], ['Landlines found', (STATE.leads||{}).landlines || null], ['Voicemails dropped', dialToday().voicemail],
    ['Replied', p.replied], ['Preview requested', p.preview_requested], ['Ready to pay', p.ready_to_pay], ['Won', p.won],
  ];
  const max = Math.max(1, ...rows.map(r => r[1] || 0));
  return `<h1>Overview</h1><p class="sub">Your outbound pipeline at a glance. Test chats are excluded.</p>
  <div class="grid g4 kpis">
    <div class="card kpi"><span>Replies</span><b>${p.replied}</b></div>
    <div class="card kpi"><span>Previews</span><b>${p.preview_requested}</b></div>
    <div class="card kpi"><span>Needs you</span><b style="color:${p.needs_human?'var(--warn)':'inherit'}">${p.needs_human}</b></div>
    <div class="card kpi"><span>Reviews</span><b>${(STATE.reviews||[]).length}</b></div>
    <div class="card kpi hide"><span>Daily goal</span><b>${(s.dialer||{}).dailyTarget ?? 500}</b></div>
  </div>
  <div class="card"><h2>Pipeline</h2><div class="funnel">
    ${rows.map(([l,v]) => v === null
      ? `<div class="frow dim"><span>${l}</span><div class="bar"></div><span class="soon">soon</span></div>`
      : `<div class="frow"><span>${l}</span><div class="bar"><div style="width:${Math.round((v/max)*100)}%"></div></div><b>${v}</b></div>`).join('')}
  </div><p class="note">${(STATE.leads||{}).scraped ? `Today: ${STATE.leads.today.scraped} scraped, ${STATE.leads.today.landlines} landlines. ` : ''}${DSTATS ? `Dialer today: ${dialToday().dialed} calls, ${dialToday().voicemail} voicemails, ${DSTATS.queued} leads waiting.` : ''}</p></div>
  <div class="grid g2">
    <div class="card"><h2>Closed out</h2><div class="funnel">
      <div class="frow"><span>Lost</span><div class="bar"><div style="width:${Math.min(100,p.lost*10)}%;background:var(--bad)"></div></div><b>${p.lost}</b></div>
      <div class="frow"><span>Opted out</span><div class="bar"><div style="width:${Math.min(100,p.opted_out*10)}%;background:var(--bad)"></div></div><b>${p.opted_out}</b></div>
    </div></div>
    <div class="card"><h2>Live status</h2>
      <div class="toggle" style="border:0"><span>Text closer</span><span class="pill ready_to_pay">On</span></div>
      <div class="toggle"><span>Sending numbers</span><span class="pill ${(s.ourNumbers||[]).length?'ready_to_pay':'needs_human'}">${(s.ourNumbers||[]).length || 'None yet'}</span></div>
      <div class="toggle"><span>Lead cleaner</span><span class="pill ${(STATE.leads||{}).scraped?'ready_to_pay':''}">${(STATE.leads||{}).scraped?'Reporting':'No runs yet'}</span></div>
      <div class="toggle"><span>Voicemail dialer</span><span class="pill ${dialStatus()[1]}">${dialStatus()[0]}</span></div>
      <div class="toggle"><span>Preview builder</span><span class="pill ready_to_pay">On</span></div>
    </div>
  </div>`;
}

function convos(){
  const list = STATE.convos;
  if (!list.length) return `<h1>Conversations</h1><p class="sub">Every lead that texts back shows up here.</p><div class="card empty">No conversations yet.</div>`;
  if (!SEL || !list.find(c => c.phone === SEL)) SEL = list[0].phone;
  const c = list.find(x => x.phone === SEL);
  return `<h1>Conversations</h1><p class="sub">Every lead that texts back, with the AI's replies and the actions it took.</p>
  <div style="margin-bottom:12px"><button class="btn btn-line btn-sm" id="cleartests">Clear test chats</button></div>
  <div class="convos">
    <div class="card clist">${list.map(x => `<div class="citem ${x.phone===SEL?'on':''}" data-c="${esc(x.phone)}">
      <b>${esc(x.name || x.phone)} ${x.test ? '<span class="pill">test</span>' : ''}</b>
      <small>${esc(x.city)} · ${ago(x.lastInbound)}</small><br><span class="pill ${x.status}">${esc(x.status.replace(/_/g,' '))}</span></div>`).join('')}</div>
    <div class="card"><h2>${esc(c.name || c.phone)}</h2>
      <p class="meta">${esc(c.phone)} · status <span class="pill ${c.status}">${esc(c.status.replace(/_/g,' '))}</span>${c.lastPrice?` · last price $${c.lastPrice}`:''}${c.plan?` · plan ${esc(c.plan)}`:''}</p>
      <div class="thread" style="margin-top:14px">${c.history.map(m => `<div class="msg ${m.role}">${esc(m.content)}<small>${new Date(m.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</small></div>`).join('')}</div>
      ${c.events.length ? `<p class="meta" style="margin-top:14px">Actions: ${c.events.map(e => esc(e.e)+(e.price?' $'+e.price:'')).join(' → ')}</p>` : ''}
    </div>
  </div>`;
}

function closer(){
  const s = DRAFT;
  return `<h1>AI texter (closer)</h1><p class="sub">How the AI sounds and the rules it follows. Changes apply to the very next text.</p>
  <div class="grid g2">
    <div class="card"><h2>Personality</h2>
      <div class="field"><label>Assistant name</label><input type="text" data-k="assistantName" value="${esc(s.assistantName)}"></div>
      <div class="field"><label>Sign-off (first message only, optional)</label><input type="text" data-k="signOff" value="${esc(s.signOff)}" placeholder="e.g. — Emmanuel @ One Web"></div>
      <div class="field"><label>Personality & voice</label><textarea data-k="personality">${esc(s.personality)}</textarea><p class="note">Describe how it should come across, e.g. "laid-back NYC, straight to the point".</p></div>
    </div>
    <div class="card"><h2>Tone</h2>
      <div class="field"><label>Formal ↔ Casual</label><div class="range"><small>Formal</small><input type="range" min="0" max="100" data-k="casual" data-num value="${s.casual}"><small>Casual</small></div></div>
      <div class="field"><label>Soft-sell ↔ Assertive</label><div class="range"><small>Soft</small><input type="range" min="0" max="100" data-k="assertive" data-num value="${s.assertive}"><small>Assertive</small></div></div>
      <div class="field"><label>Message length</label><select data-k="length">${['short','medium','long'].map(v => `<option ${s.length===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="toggle"><span>Allow emojis</span><input type="checkbox" data-k="emojis" ${s.emojis?'checked':''}></div>
      <div class="field" style="margin-top:12px"><label>AI model</label><select data-k="model">${['gpt-5-mini','gpt-6-luna'].map(v => `<option ${s.model===v?'selected':''}>${v}</option>`).join('')}</select><p class="note">gpt-5-mini is cheapest. Switch up only if replies feel weak.</p></div>
      <div class="field"><label>Max AI replies per lead per day</label><input type="number" data-k="maxAiRepliesPerDay" data-num value="${s.maxAiRepliesPerDay}"></div>
    </div>
  </div>
  <div class="card rules"><h2>Your guardrails</h2><p class="sub" style="margin-bottom:14px">Plain-English rules the AI must follow. Built-in safety (STOP/HELP, honesty, the price floor) always wins over these.</p>
    ${(s.customRules||[]).map((r,i) => `<div class="rule"><input type="text" data-rule="${i}" value="${esc(r)}"><button class="btn btn-line btn-sm" data-delrule="${i}">Remove</button></div>`).join('')}
    <button class="btn btn-line btn-sm" id="addrule">+ Add rule</button>
  </div>${savebar()}`;
}

function pricing(){
  const s = DRAFT;
  return `<h1>Pricing</h1><p class="sub">What the closer offers and how far it can negotiate.</p>
  <div class="grid g2">
    <div class="card"><h2>Website</h2>
      <div class="grid g2"><div class="field"><label>List price $</label><input type="number" data-k="listPrice" data-num value="${s.listPrice}"></div>
      <div class="field"><label>Commit-now price $</label><input type="number" data-k="commitPrice" data-num value="${s.commitPrice}"></div></div>
      <div class="grid g2"><div class="field"><label>Commit window (hours)</label><input type="number" data-k="commitWindowHours" data-num value="${s.commitWindowHours}"></div>
      <div class="field"><label>Floor $ (never below)</label><input type="number" data-k="floorPrice" data-num value="${s.floorPrice}"></div></div>
      <div class="field"><label>Discount steps after commit price $ (comma separated)</label><input type="text" data-k="discountSteps" data-list value="${esc((s.discountSteps||[]).join(', '))}"></div>
      <div class="toggle"><span>Strict ladder (one step per objection)</span><input type="checkbox" data-k="strictLadder" ${s.strictLadder?'checked':''}></div>
    </div>
    <div class="card"><h2>Hosting</h2>
      <div class="field"><label>Hosted & cared for $ / month</label><input type="number" data-k="hostingMonthly" data-num value="${s.hostingMonthly}"></div>
      <div class="toggle"><span>Offer 1st month free at the lowest step</span><input type="checkbox" data-k="freeHostingMonthAtFloor" ${s.freeHostingMonthAtFloor?'checked':''}></div>
      <h2 style="margin-top:22px">Review offer</h2>
      <div class="toggle" style="border:0"><span>Offer a price for an honest review of the preview</span><input type="checkbox" data-k="reviewOffer" ${s.reviewOffer?'checked':''}></div>
      <div class="field"><label>Price after any honest review $</label><input type="number" data-k="reviewPrice" data-num value="${s.reviewPrice}"></div>
      <p class="note">Applies whatever they say, good or bad. The AI never asks for a positive review.</p>
      <p class="note" style="margin-top:14px">Ladder preview: <b id="ladder"></b></p>
    </div>
  </div>${savebar()}`;
}

function voice(){
  const s = DRAFT;
  const d = Object.assign({ dailyTarget:50, enabled:false, startHour:9, endHour:20, liveAction:'hangup', voicemailUrl:'', perNumberCap:100, connectionId:'' }, s.dialer || {});
  const t = dialToday(), [stTxt, stCls] = dialStatus();
  const ready = d.connectionId && (s.ourNumbers||[]).length;
  const hr = h => ((h % 12) || 12) + (h < 12 ? 'am' : 'pm');
  return `<h1>AI caller & dialer</h1><p class="sub">Voicemail drops to callable leads. When they text back, the AI closer takes over.</p>
  <div class="grid g4 kpis">
    <div class="card kpi"><span>Calls today</span><b>${t.dialed}</b></div>
    <div class="card kpi"><span>Voicemails left</span><b>${t.voicemail}</b></div>
    <div class="card kpi"><span>Live pickups</span><b>${t.human + t.unsure}</b></div>

function results(){
  const H = (DSTATS && DSTATS.history) || {}; const ramp = (DSTATS && DSTATS.ramp) || {};
  const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const dialsN = {}, dialsT = {};
  for (const [d, v] of Object.entries(H)) { if (d < since) continue; for (const [k, n] of Object.entries(v.n || {})) dialsN[k] = (dialsN[k] || 0) + n; for (const [k, n] of Object.entries(v.t || {})) dialsT[k] = (dialsT[k] || 0) + n; }
  const R = STATE.results || { byNumber: {}, byTrade: {} }; const C = STATE.callResults || { week: {}, total: 0 };
  const table = (dials, rep, label, extra) => { const keys = [...new Set(Object.keys(dials).concat(Object.keys(rep)))].sort((a, b) => (dials[b] || 0) - (dials[a] || 0));
    if (!keys.length) return '<p class="note">No data yet. Fills in once the dialer is running.</p>';
    return `<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="color:var(--mut);text-align:left"><th>${label}</th><th>Dials (7d)</th><th>Texted back</th><th>Reply rate</th><th>Saw site</th><th>Won</th>${extra ? '<th>Cap today</th>' : ''}</tr>
    ${keys.map(k => { const d = dials[k] || 0, r = rep[k] || {}; const rate = d ? (100 * (r.replied || 0) / d).toFixed(1) + '%' : '—';
      return `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 0">${esc(k)}</td><td>${d}</td><td>${r.replied || 0}</td><td><b>${rate}</b></td><td>${r.preview || 0}</td><td>${r.won || 0}</td>${extra ? `<td>${ramp[k] ?? '—'}</td>` : ''}</tr>`; }).join('')}</table>`; };
  const w = C.week || {};
  return `<h1>Call results</h1><p class="sub">Check once a week. Keep what works, change one thing that doesn't. Reply rate is the number that matters most.</p>
  <div class="grid g4 kpis">
    <div class="card kpi"><span>Emma calls (7d)</span><b>${C.total || 0}</b></div>
    <div class="card kpi"><span>Wanted to see site</span><b>${w.wants_to_see_site || 0}</b></div>
    <div class="card kpi"><span>Busy, call back</span><b>${w.busy_call_back || 0}</b></div>

  <div class="card"><h2>By trade</h2>${table(dialsT, R.byTrade || {}, 'Trade')}</div>
  <div class="card"><h2>By phone number</h2><p class="note">Cap today = warm-up limit (starts at 20/day, +10 each week). A number with a much lower reply rate than the rest may be getting flagged as spam: rest it.</p>${table(dialsN, R.byNumber || {}, 'Number', true)}</div>
  ${callsList()}`;
}

/* voice A/B test: which voice gets the most "wants to see the site" */
function voiceTest(){
  const V = STATE.voiceStats || {}; const keys = Object.keys(V).sort((a, b) => V[b].calls - V[a].calls);
  if (!keys.length) return '<div class="card"><h2>Voice test</h2><p class="note">Fills in as Emma makes calls. Each call uses one of the voices set in Phone & Dialer.</p></div>';
  const rate = v => v.calls ? v.wants_to_see_site / v.calls : 0; const best = keys.reduce((a, k) => rate(V[k]) > rate(V[a]) ? k : a, keys[0]);
  return `<div class="card"><h2>Voice test</h2><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="color:var(--mut);text-align:left"><th>Voice</th><th>Calls</th><th>Wants site</th><th>Conversion</th><th>Busy</th><th>Not interested</th></tr>
    ${keys.map(k => { const v = V[k]; return `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 0">${esc(k)}${k === best && v.calls >= 30 ? ' <span class="pill won">leading</span>' : ''}</td><td>${v.calls}</td><td>${v.wants_to_see_site || 0}</td><td><b>${(100 * rate(v)).toFixed(1)}%</b></td><td>${v.busy_call_back || 0}</td><td>${v.not_interested || 0}</td></tr>`; }).join('')}</table>
    <p class="note" style="margin-top:10px">Don't pick a winner until each voice has about 100 pickups; small numbers swing a lot.</p></div>`;
}

/* API cost meter: estimated from what each call used (list prices, pay-as-you-go) */
const RATES = { telMin: 0.007, streamMin: 0.0035, amdCall: 0.0065, sttMin: 0.0048, rimeSttMin: 0.002, mistMin: 0.03, bigIn: 2.0, bigOut: 8.0, llmIn: 0.40, llmOut: 1.60, rimeMin: 0.05, rimeCharsPerMin: 900, cartChar: 0.00004, rimeFree: 50 };
function costDay(d){
  const u = (STATE.usage || {})[d] || {}, o = ((DSTATS && DSTATS.outcomes) || {})[d] || {};
  const aiMin = (u.secs || 0) / 60;
  const telnyx = (o.talkSec || 0) / 60 * RATES.telMin + (o.answered || 0) * RATES.amdCall + aiMin * RATES.streamMin;
  const rsMin = (u.rimeSttSecs || 0) / 60;
  const stt = Math.max(0, aiMin - rsMin) * RATES.sttMin + rsMin * RATES.rimeSttMin;
  const llm = (u.llmIn || 0) / 1e6 * RATES.llmIn + (u.llmOut || 0) / 1e6 * RATES.llmOut + (u.bigIn || 0) / 1e6 * RATES.bigIn + (u.bigOut || 0) / 1e6 * RATES.bigOut;
  const rime = (u.rimeChars || 0) / RATES.rimeCharsPerMin * RATES.rimeMin + (u.mistChars || 0) / RATES.rimeCharsPerMin * RATES.mistMin;
  const cartesia = (u.cartesiaChars || 0) * RATES.cartChar;
  return { telnyx, stt, llm, rime, cartesia, total: telnyx + stt + llm + rime + cartesia, calls: u.calls || 0, dials: o.ended || 0 };
}
function costs(){
  const days = [...new Set(Object.keys(STATE.usage || {}).concat(Object.keys((DSTATS && DSTATS.outcomes) || {})))];
  const fmt = n => '$' + (n < 1 ? n.toFixed(3) : n.toFixed(2));
  const sum = list => list.reduce((a, d) => { const c = costDay(d); for (const k in c) a[k] = (a[k] || 0) + c[k]; return a; }, {});
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
  const wk = new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10), mo = today.slice(0, 7);
  const T = sum(days.filter(d => d === today)), W = sum(days.filter(d => d >= wk)), M = sum(days.filter(d => d.startsWith(mo)));
  const per = M.calls ? (M.stt + M.llm + M.rime + M.cartesia) / M.calls : 0;
  const rows = [['Telnyx (calls, voicemail check, audio stream)', M.telnyx], ['Hearing (Rime / Deepgram)', M.stt], ['OpenAI (Emma thinking)', M.llm], ['Rime (Emma voice)', M.rime], ['Cartesia (old voice)', M.cartesia]];
  const max = Math.max(0.0001, ...rows.map(r => r[1] || 0));
  return `<div class="card"><h2>API costs (estimate)</h2>
    <div class="grid g4 kpis" style="margin-bottom:14px">
      <div class="card kpi" style="margin:0"><span>Today</span><b>${fmt(T.total || 0)}</b></div>
      <div class="card kpi" style="margin:0"><span>Last 7 days</span><b>${fmt(W.total || 0)}</b></div>
      <div class="card kpi" style="margin:0"><span>This month</span><b>${fmt(M.total || 0)}</b></div>
      <div class="card kpi" style="margin:0"><span>AI per Emma call</span><b>${fmt(per)}</b></div></div>
    <div class="funnel">${rows.map(([l, v]) => `<div class="frow"><span>${l}</span><div class="bar"><div style="width:${Math.round((v || 0) / max * 100)}%"></div></div><b>${fmt(v || 0)}</b></div>`).join('')}</div>
    <p class="note" style="margin-top:12px">This month: ${M.dials || 0} dials, ${M.calls || 0} Emma calls. Rime free credit: ${fmt(Math.min(M.rime || 0, RATES.rimeFree))} of $${RATES.rimeFree} used (resets monthly). Based on list prices; texts, numbers and monthly plans aren't included. Check each provider's billing page for exact charges.</p></div>`;
}

/* paying clients + plan switches */
function clients(){
  const c = CLIENTS || [];
  return `<h1>Clients</h1><p class="sub">Everyone who paid. Turn on the AI chat for clients on the Growth plan (it shows on their live site and saves visitor leads to their portal).</p>
  ${c.length ? c.map(x => `<div class="card" style="padding:16px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
    <div><b>${esc(x.name)}</b>${x.city ? ' · ' + esc(x.city) : ''}<br><span class="note"><a href="${esc(x.site)}" target="_blank" rel="noopener">${esc(x.site.replace(/^https:\/\//, ''))}</a> · ${x.live ? 'live' : 'not published yet'}${x.email ? ' · ' + esc(x.email) : ''}${x.billing ? ' · billing linked' : ''} · ${x.leads} chat leads · ${x.bookings} bookings</span></div>
    <label class="toggle" style="margin:0;gap:10px"><span>AI chat (Growth)</span><input type="checkbox" data-cchat="${esc(x.slug)}" ${x.chat ? 'checked' : ''}></label></div></div>`).join('') : '<div class="card empty">No paying clients yet.</div>'}`;
}

/* Emma's calls: outcome + full transcript of what each side said */
let OPEN_T = null, T_CACHE = {};
function callsList(){
  const calls = (STATE.calls || []).slice(0, 50);
  const label = { wants_to_see_site: 'Wants to see site', busy_call_back: 'Busy, call back', not_interested: 'Not interested', other: 'Other' };
  const pill = { wants_to_see_site: 'won', busy_call_back: 'preview_requested', not_interested: 'lost', other: '' };
  const row = c => {
    const t = OPEN_T === c.call_id ? T_CACHE[c.call_id] : null;
    return `<div class="card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
        <div><b>${c.owner ? esc(c.owner) + ' · ' : ''}${esc(c.name || c.phone)}</b>${c.city ? ' · ' + esc(c.city) : ''}<br><span class="note">${ago(c.at)} · ${esc(c.phone)}${c.secs ? ' · ' + c.secs + 's' : ''}${c.email ? ' · link emailed' : c.ok_to_text ? ' · ok to text' : ''}</span>${c.note ? `<br><span class="note">${esc(c.note)}</span>` : ''}</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="pill ${pill[c.outcome] || ''}">${esc(label[c.outcome] || c.outcome || '')}</span>
        ${c.hasT ? `<button class="btn btn-line btn-sm" data-tr="${esc(c.call_id)}">${OPEN_T === c.call_id ? 'Hide' : 'Transcript'}</button>` : ''}</div></div>
      ${t ? `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px">${(t.tr || []).map(m => `<div style="max-width:85%;${m.r === 'emma' ? '' : 'margin-left:auto;text-align:right'}"><span class="note">${m.r === 'emma' ? 'Emma' : 'Lead'}</span><div style="background:${m.r === 'emma' ? 'rgba(201,168,106,.12)' : 'rgba(255,255,255,.05)'};padding:8px 12px;border-radius:12px">${esc(m.t)}</div></div>`).join('') || '<span class="note">Empty transcript.</span>'}</div>` : ''}
    </div>`;
  };
  return `<h2 style="margin:22px 0 10px">Recent calls with Emma</h2>${calls.length ? calls.map(row).join('') : '<div class="card empty">No calls yet.</div>'}`;
}

const savebar = () => `<div class="savebar"><span id="savemsg">${DIRTY ? 'Unsaved changes' : ''}</span><button class="btn btn-line" id="discard" ${DIRTY?'':'disabled'}>Discard</button><button class="btn btn-gold" id="save">Save settings</button></div>`;
function markDirty(){ DIRTY = true; const m = $('#savemsg'); if (m) m.textContent = 'Unsaved changes'; const d = $('#discard'); if (d) d.disabled = false; ladderPreview(); }
function ladderPreview(){ const el = $('#ladder'); if (!el) return; const s = DRAFT; const steps = [s.listPrice, s.commitPrice].concat(s.discountSteps||[]).filter(n => n >= s.floorPrice); el.textContent = steps.map(n => '$'+n).join(' → ') + `  (floor $${s.floorPrice})`; }

function bind(){
  document.querySelectorAll('[data-k]').forEach(el => el.oninput = el.onchange = () => {
    const k = el.dataset.k; let v = el.type === 'checkbox' ? el.checked : el.value;
    if ('num' in el.dataset) v = Number(v);
    if ('list' in el.dataset) v = String(v).split(/[,\s]+/).map(Number).filter(n => n > 0);
    if ('lines' in el.dataset) v = String(v).split(/\n+/).map(x => x.trim()).filter(Boolean);
    DRAFT[k] = v; markDirty();
  });
  document.querySelectorAll('[data-v]').forEach(el => el.oninput = el.onchange = () => { DRAFT.voice = DRAFT.voice || {provider:'telnyx',voiceId:'',speed:1,notes:''}; DRAFT.voice[el.dataset.v] = 'num' in el.dataset ? Number(el.value) : el.value; markDirty(); });
  document.querySelectorAll('[data-voice]').forEach(el => el.onclick = e => { e.preventDefault(); const i = document.getElementById('agentVoice'); i.value = el.dataset.voice; i.dispatchEvent(new Event('change')); });
  document.querySelectorAll('[data-dvm]').forEach(el => el.onchange = () => { DRAFT.dialer = DRAFT.dialer || {dailyTarget:50,enabled:false}; DRAFT.dialer.voicemailOff = !el.checked; markDirty(); });
  document.querySelectorAll('[data-d]').forEach(el => el.oninput = el.onchange = () => { DRAFT.dialer = DRAFT.dialer || {dailyTarget:50,enabled:false}; DRAFT.dialer[el.dataset.d] = el.type === 'checkbox' ? el.checked : ('num' in el.dataset ? Number(el.value) : el.value); if (el.dataset.d === 'agentSpeed') { const v = document.getElementById('spdv'); if (v) v.textContent = Number(el.value).toFixed(2) + 'x'; } markDirty(); });
  document.querySelectorAll('[data-rule]').forEach(el => el.oninput = () => { DRAFT.customRules[+el.dataset.rule] = el.value; markDirty(); });
  document.querySelectorAll('[data-delrule]').forEach(el => el.onclick = () => { DRAFT.customRules.splice(+el.dataset.delrule, 1); markDirty(); render(); });
  const add = $('#addrule'); if (add) add.onclick = () => { DRAFT.customRules = (DRAFT.customRules||[]).concat(['']); markDirty(); render(); const ins = document.querySelectorAll('[data-rule]'); ins[ins.length-1].focus(); };
  const save = $('#save'); if (save) save.onclick = async () => {
    save.disabled = true; $('#savemsg').textContent = 'Saving…';
    try { DIRTY = false; await load('save_settings', { settings: DRAFT }); $('#savemsg').textContent = 'Saved ✓'; }
    catch(e){ DIRTY = true; $('#savemsg').textContent = e.auth ? 'Signed out' : 'Save failed, try again'; if (e.auth) logout(); }
    save.disabled = false;
  };
  const disc = $('#discard'); if (disc) disc.onclick = () => { DIRTY = false; DRAFT = JSON.parse(JSON.stringify(STATE.settings)); render(); };
  document.querySelectorAll('[data-c]').forEach(el => el.onclick = () => { SEL = el.dataset.c; render(); });
  document.querySelectorAll('[data-rv]').forEach(el => el.onclick = () => load('review_set', { id: el.dataset.rv, status: el.dataset.st }));
  document.querySelectorAll('[data-sb]').forEach(el => el.onclick = async () => { if (el.dataset.ss === 'delete' && !confirm('Delete this booking request?')) return; try { SITEBK = (await call(EDIT, { op: 'site_booking_set', slug: el.dataset.sb, at: Number(el.dataset.sat), status: el.dataset.ss })).bookings || []; render(); } catch (e) { alert('Could not update. Try again.'); } });
  document.querySelectorAll('[data-cchat]').forEach(el => el.onchange = async () => { try { CLIENTS = (await call(EDIT, { op: 'client_set', slug: el.dataset.cchat, chatOn: el.checked })).clients || CLIENTS; render(); } catch (e) { alert('Could not update. Try again.'); el.checked = !el.checked; } });
  document.querySelectorAll('[data-tr]').forEach(el => el.onclick = async () => {
    const id = el.dataset.tr; if (OPEN_T === id) { OPEN_T = null; render(); return; }
    if (!T_CACHE[id]) { el.textContent = 'Loading...'; try { const r = await call(API, { op: 'transcript', call_id: id }); T_CACHE[id] = r.transcript || { tr: [] }; } catch (e) { el.textContent = 'Transcript'; return; } }
    OPEN_T = id; render(); });
  document.querySelectorAll('[data-bk]').forEach(el => el.onclick = () => load('booking_set', { id: el.dataset.bk, status: el.dataset.bs }));
  document.querySelectorAll('[data-bkm]').forEach(el => el.onclick = () => { const i = document.querySelector(`[data-bkt="${CSS.escape(el.dataset.bkm)}"]`); const t = i && i.value ? new Date(i.value).getTime() : 0; if (t > Date.now()) load('booking_set', { id: el.dataset.bkm, at: t }); else if (i) i.focus(); });
  const ct = $('#cleartests'); if (ct) ct.onclick = () => load('clear_tests');
  const ts = $('#tsend'); if (ts) { const send = () => testSend(); ts.onclick = send; $('#tmsg').onkeydown = e => { if (e.key === 'Enter') send(); }; }
  const tr = $('#treset'); if (tr) tr.onclick = () => testSend(true);
  ladderPreview();
}

async function testSend(reset){
  const input = $('#tmsg'); const text = reset ? '' : input.value.trim();
  if (!reset && !text) return;
  const th = $('#tthread');
  if (reset) { th.innerHTML = '<div class="empty">Say hi to start.</div>'; }
  else { if (th.querySelector('.empty')) th.innerHTML = ''; th.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(text)}</div><div class="msg assistant" id="typing">…</div>`); input.value = ''; th.scrollTop = th.scrollHeight; }
  const lead = { name: $('#tn').value, city: $('#tc').value, state: $('#ts').value, category: $('#tt').value, website_status: $('#tw').value };
  try {
    if (reset) { await call(CHAT, { from:'+15550000001', text:'', lead, reset:true }).catch(()=>{}); await load(); return; }
    const r = await call(CHAT, { from:'+15550000001', text, lead });
    $('#typing').outerHTML = `<div class="msg assistant">${esc(r.text || '(no reply)')}</div>`;
    $('#tinfo').textContent = `Action: ${r.action} · status: ${r.status}${r.price ? ' · price $'+r.price : ''}${r.notes ? ' · '+r.notes : ''}`;
    th.scrollTop = th.scrollHeight;
  } catch(e){ const t = $('#typing'); if (t) t.outerHTML = `<div class="msg assistant" style="color:var(--bad)">${e.auth?'Signed out':'Error: '+esc(e.message)}</div>`; }
}

function logout(){ store.clear('ow_auth'); AUTH = null; $('#app').classList.add('hide'); $('#login').classList.remove('hide'); }
async function start(){
  AUTH = store.get('ow_auth');
  if (!AUTH) { $('#login').classList.remove('hide'); return; }
  try { await load(); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); }
  catch(e){ if (e.auth) logout(); else { $('#login').classList.remove('hide'); $('#lerr').textContent = 'Could not reach the server: '+e.message; } }
}
$('#lbtn').onclick = async () => {
  $('#lerr').textContent = '';
  AUTH = btoa(unescape(encodeURIComponent($('#lu').value + ':' + $('#lp').value)));
  try { await load(); store.set('ow_auth', AUTH, $('#lr').checked); $('#lp').value = ''; $('#login').classList.add('hide'); $('#app').classList.remove('hide'); }
  catch(e){ AUTH = null; $('#lerr').textContent = e.auth ? 'Wrong username or password.' : 'Could not reach the server.'; }
};
$('#lp').onkeydown = e => { if (e.key === 'Enter') $('#lbtn').click(); };
$('#logout').onclick = logout;
setInterval(() => { if (AUTH && !DIRTY && TAB !== 'test' && document.visibilityState === 'visible') load().catch(()=>{}); }, 30000);
start();
</script>
</body>
