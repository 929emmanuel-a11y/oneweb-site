<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Client Portal | One Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#131312;--bg3:#1a1a19;--line:rgba(237,232,224,.12);--txt:#ede8e0;--mut:#9b958c;--gold:#c9a86a;--gold2:#e6cf9e;--ok:#7fbf8e;--bad:#e08a7a;
--serif:"Instrument Serif",Georgia,serif;--sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,10,.85);backdrop-filter:blur(12px);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{font-family:var(--serif);font-size:24px;text-decoration:none;color:var(--txt)}.brand span{color:var(--gold)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:36px 0 8px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 14px}
input,select,textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
input[type=color]{height:46px;padding:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;padding:12px 22px;border-radius:999px;font:500 14px var(--sans);text-decoration:none}
.btn-gold{background:var(--gold);color:#0a0a0a}.btn-gold:hover{background:var(--gold2)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn-line:hover{border-color:var(--gold)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 22px;padding-bottom:2px}
.tab{background:none;border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:999px;font:500 14px var(--sans);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);color:var(--txt);font-weight:500;font-size:15px;margin:0}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.toggle input{width:44px;height:24px;margin:0;flex:none;accent-color:var(--gold)}
.note{color:var(--mut);font-size:14px}
.msg{min-height:22px;font-size:14px;margin:10px 0 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg3);color:var(--mut)}
.pill.ok{background:rgba(127,191,142,.15);color:var(--ok)}.pill.new{background:rgba(201,168,106,.18);color:var(--gold2)}.pill.bad{background:rgba(224,138,122,.15);color:var(--bad)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg3);aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .act{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:6px;justify-content:space-between}
.ph .act button{background:rgba(10,10,10,.8);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:500 12px var(--sans);cursor:pointer}
.ph .main{position:absolute;top:6px;left:6px}
.svcs .s{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;margin-bottom:8px}.svcs .s input{margin:0}@media(max-width:600px){.svcs .s{grid-template-columns:1fr}}
.svcs .s button{flex:none}
.hours .h{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}.hours .h input{margin:0}
.bk{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.bk>.pill{flex:none}
.bkact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.login{max-width:420px;margin:0 auto}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
body.in .wrap{max-width:1180px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;padding:22px 0 30px;border-right:1px solid var(--line);padding-right:18px}
.side .who{padding:0 10px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.side .who b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.15;margin-bottom:6px}
.grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:16px 10px 6px}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--txt);font:500 14px var(--sans);padding:9px 10px;border-radius:10px;cursor:pointer}
.nv:hover{background:var(--bg3)}.nv.on{background:rgba(201,168,106,.16);color:var(--gold2)}
.nv .cnt{margin-left:auto;background:var(--gold);color:#0a0a0a;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nv .soon{margin-left:auto;font-size:10px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.pmain{padding:4px 0 0;min-width:0}
.crumb{font-size:12px;color:var(--mut);margin:26px 0 -24px;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--txt)}.tile:hover{border-color:var(--gold)}
.tile b{display:block;font-size:26px;font-weight:700}.tile span{color:var(--mut);font-size:13px}
#menu{background:none;border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font:500 13px var(--sans);cursor:pointer}
.scrim{display:none}
@media (min-width:901px){#menu{display:none!important}}
@media (max-width:900px){.shell{display:block}.side{position:fixed;z-index:20;top:0;left:0;bottom:0;width:280px;max-height:none;background:var(--bg);padding:18px 16px;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s}
 body.navopen .side{transform:none}body.navopen .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55)}.crumb{margin-top:20px}}
footer{color:var(--mut);font-size:13px;padding:40px 0;border-top:1px solid var(--line);margin-top:40px}
footer a{color:var(--mut)}
@media (max-width:560px){.row{grid-template-columns:1fr}.hours .h{grid-template-columns:1fr 1fr}.hours .h button{grid-column:1/-1}h1{margin-top:26px}}
</style>
</head>
<body>
<header><div class="wrap"><div style="display:flex;gap:12px;align-items:center"><button id="menu" class="hide" type="button" aria-label="Open menu">☰ Menu</button><a class="brand" href="/">One Web<span>.</span></a></div><button id="out" class="btn btn-line btn-sm hide" type="button">Log out</button></div></header>

<main class="wrap">
  <!-- login -->
  <section id="login" class="login hide">
    <h1>Client portal</h1>
    <p class="sub" id="lsub">Log in with the email you paid with. We'll email you a 6-digit code. No password needed.</p>
    <div class="card">
      <form id="f1">
        <label>Phone number<input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" required></label>
        <button class="btn btn-gold" type="submit">Text me a code</button>
      </form>
      <form id="f2" class="hide">
        <label>6-digit code<input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required></label>
        <label class="toggle" style="border:0;padding:0 0 14px"><span>Keep me logged in on this device</span><input id="rem" type="checkbox" checked></label>
        <button class="btn btn-gold" type="submit">Log in</button>
        <button class="btn btn-line" type="button" id="back">Use another number</button>
      </form>
      <form id="e1" class="hide">
        <label>Email on your account<input id="em" type="email" autocomplete="email" placeholder="you@business.com" required></label>
        <button class="btn btn-gold" type="submit">Email me a code</button>
      </form>
      <form id="e2" class="hide">
        <label>6-digit code from your email<input id="ecd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required></label>
        <p class="note" id="timer" style="margin:-6px 0 14px"></p>
        <label class="toggle" style="border:0;padding:0 0 14px"><span>Keep me logged in on this device</span><input id="erem" type="checkbox" checked></label>
        <button class="btn btn-gold" type="submit" id="ego">Log in</button>
        <button class="btn btn-line" type="button" id="eagain">Send a new code</button>
      </form>
      <p class="msg" id="lmsg" role="status" aria-live="polite"></p>
      <p style="margin:14px 0 0"><button class="btn btn-line btn-sm" type="button" id="swap">No access to your phone? Sign in with an email code instead</button></p>
    </div>
    <p class="note">Not a client yet? <a href="/">See what One Web does</a>.</p>
  </section>

  <!-- app -->
  <section id="app" class="hide"><div class="shell">
    <aside class="side" id="side"><div class="who"><b id="sbiz">Your website</b><span id="sstat"></span></div><nav id="nav" aria-label="Portal sections"></nav></aside>
    <div class="scrim" id="scrim"></div>
    <div class="pmain" id="pmain"><p class="crumb" id="crumb"></p><div id="view"></div></div>
  </div></section>
</main>
<footer><div class="wrap">One Web is a brand of Dolyn · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="/agreement.html">Client agreement</a> · <a href="/refund.html">Refunds</a></div></footer>

<script>
const API = 'https://n8n-production-9be3db1c.up.railway.app/webhook/oneweb-portal';
const $ = s => document.querySelector(s);
const fmtPhone = p => { const d = String(p || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : p; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v, keep) { try { (keep ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {} } };
let TOKEN = ls.get('ow_portal'), D = null, TAB = 'home', PHONE = '';
// "Take a look" sample account (/portal/?demo). Same screens as the real portal; data stays in this page.
const DEMO = /[?&]demo\b/.test(location.search) || location.hash === '#demo';
try { TAB = (!DEMO && localStorage.getItem('ow_portal_tab')) || 'home'; } catch (e) {}

async function api(body) {
  if (DEMO) return demoApi(body);
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: TOKEN }, body)) });
  if (!r.ok) throw new Error('server');
  const j = await r.json();
  if (j.error === 'auth') { logout(); throw new Error('auth'); }
  return j;
}
function showLogin() { $('#login').classList.remove('hide'); $('#app').classList.add('hide'); $('#out').classList.add('hide'); $('#menu').classList.add('hide'); document.body.classList.remove('in', 'navopen'); }
function logout() { if (DEMO) { location.href = '/'; return; } if (TOKEN) fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'logout', token: TOKEN }) }).catch(() => {}); TOKEN = null; ls.del('ow_portal'); showLogin(); }

/* ---------- login ---------- */
$('#f1').onsubmit = async e => {
  e.preventDefault(); const m = $('#lmsg'); PHONE = $('#ph').value;
  if (PHONE.replace(/\D/g, '').length < 10) { m.className = 'msg bad'; m.textContent = 'Enter a 10-digit phone number.'; return; }
  m.className = 'msg'; m.textContent = 'Sending...';
  try { await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'send_code', phone: PHONE }) });
    $('#f1').classList.add('hide'); $('#f2').classList.remove('hide'); $('#cd').focus();
    m.textContent = 'If that number is on a One Web account, a code is on its way.';
  } catch (err) { m.className = 'msg bad'; m.textContent = 'Could not reach the server. Try again.'; }
};
$('#back').onclick = () => { $('#f2').classList.add('hide'); $('#f1').classList.remove('hide'); $('#lmsg').textContent = ''; };
$('#f2').onsubmit = async e => {
  e.preventDefault(); const m = $('#lmsg'); m.className = 'msg'; m.textContent = 'Checking...';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'verify', phone: PHONE, code: $('#cd').value }) }).then(r => r.json());
    if (!r.ok) { m.className = 'msg bad'; m.textContent = r.error === 'wrong' ? 'That code is not right. Check the text and try again.' : 'That code expired. Use another number or ask for a new code.'; return; }
    TOKEN = r.token; ls.set('ow_portal', TOKEN, $('#rem').checked); $('#cd').value = ''; m.textContent = '';
    await load();
  } catch (err) { m.className = 'msg bad'; m.textContent = 'Could not reach the server. Try again.'; }
};
$('#out').onclick = logout;
$('#menu').onclick = () => document.body.classList.toggle('navopen');
$('#scrim').onclick = () => document.body.classList.remove('navopen');

/* email login (backup when they can't get texts) */
let EMAIL = '', TIMER = null, MODE = 'phone';
$('#swap').onclick = () => {
  MODE = MODE === 'phone' ? 'email' : 'phone'; $('#lmsg').textContent = ''; clearInterval(TIMER);
  ['#f1', '#f2', '#e1', '#e2'].forEach(s => $(s).classList.add('hide'));
  $(MODE === 'phone' ? '#f1' : '#e1').classList.remove('hide');
  $('#swap').textContent = MODE === 'phone' ? 'Sign in with an email code instead' : 'Sign in with a text code instead';
  $('#lsub').textContent = MODE === 'phone' ? "Log in with the phone number on your account. We'll text you a 6-digit code." : "Log in with the email you paid with. We'll email you a 6-digit code. No password needed.";
};
$('#swap').click();   // email first
async function sendEmailCode() {
  const m = $('#lmsg'); m.className = 'msg'; m.textContent = 'Sending...';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'send_email_code', email: EMAIL }) }).then(r => r.json());
    $('#e1').classList.add('hide'); $('#e2').classList.remove('hide'); $('#ego').disabled = false; $('#ecd').value = ''; $('#ecd').focus();
    m.textContent = 'If that email is on a One Web account, a code is on its way. Check your spam folder too. Nothing after 2 minutes? Use the email you paid with, or email hello@onewebonline.com with your site code.';
    let left = r.ttl || 120; clearInterval(TIMER);
    const tick = () => { const t = $('#timer');
      if (left <= 0) { clearInterval(TIMER); t.textContent = 'This code expired. Tap "Send a new code".'; $('#ego').disabled = true; return; }
      t.textContent = `Code expires in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; left--; };
    tick(); TIMER = setInterval(tick, 1000);
  } catch (e) { m.className = 'msg bad'; m.textContent = 'Could not reach the server. Try again.'; }
}
$('#e1').onsubmit = e => { e.preventDefault(); EMAIL = $('#em').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(EMAIL)) { const m = $('#lmsg'); m.className = 'msg bad'; m.textContent = 'Enter a valid email.'; return; }
  sendEmailCode(); };
$('#eagain').onclick = sendEmailCode;
$('#e2').onsubmit = async e => {
  e.preventDefault(); const m = $('#lmsg'); m.className = 'msg'; m.textContent = 'Checking...';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'verify_email', email: EMAIL, code: $('#ecd').value }) }).then(r => r.json());
    if (!r.ok) { m.className = 'msg bad'; m.textContent = r.error === 'wrong' ? 'That code is not right. Check the email and try again.' : 'That code expired. Tap "Send a new code".'; return; }
    clearInterval(TIMER); TOKEN = r.token; ls.set('ow_portal', TOKEN, $('#erem').checked); m.textContent = '';
    await load();
  } catch (err) { m.className = 'msg bad'; m.textContent = 'Could not reach the server. Try again.'; }
};

/* ---------- app ---------- */
// Sidebar, grouped like the owner dashboard. Each entry: [key, label]. Add new client features here (the sample account picks them up too).
const NAV = [
  ['', [['home', 'Overview']]],
  ['Website', [['site', 'Business info'], ['look', 'Design'], ['photos', 'Photos & logo'], ['content', 'Pages & towns'], ['domain', 'Domain']]],
  ['Communication', [['chat', 'AI chat assistant'], ['alerts', 'Bookings & alerts'], ['texting', 'Text us changes'], ['agents', 'AI receptionist']]],
  ['Customers', [['bookings', 'Leads'], ['reviews', 'Reviews'], ['results', 'Results']]],
  ['Account', [['account', 'Login'], ['billing', 'Billing']]]];
const KEYS = NAV.flatMap(g => g[1].map(x => x[0]));
if (!KEYS.includes(TAB)) TAB = 'home';
/* first login: "Is this still correct?" with their Google info filled in */
function showConfirm() {
  if (document.getElementById('cfm')) return;
  const f = D.fields, hrs = Object.entries(f.hours || {}).map(([d, t]) => `${d}: ${t}`).join('\n'), svc = (f.services || []).map(x => String(x).split(':')[0]).join('\n');
  document.body.insertAdjacentHTML('beforeend', `<div id="cfm" role="dialog" aria-modal="true" aria-labelledby="cfmh" style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px">
    <form id="cff" class="card" style="max-width:560px;width:100%;margin:auto"><h2 id="cfmh" style="margin-top:0">Is this still correct?</h2>
    <p class="note" style="margin-top:-6px">We pulled this from your Google listing. Fix anything that's off, then hit the button. Your site and AI use these details.</p>
    <label>Business name<input name="name" value="${esc(f.name)}" required></label>
    <div class="row"><label>Phone<input name="phone" type="tel" value="${esc(fmtPhone(f.phone))}"></label><label>Address<input name="address" value="${esc(f.address)}"></label></div>
    <label>Hours <span class="note">(one per line, like "Mon-Fri: 8am-6pm")</span><textarea name="hours" rows="4" placeholder="Mon-Fri: 8am-6pm&#10;Sat: 9am-1pm&#10;Sun: Closed">${esc(hrs)}</textarea></label>
    <label>Services <span class="note">(one per line)</span><textarea name="services" rows="4">${esc(svc)}</textarea></label>
    <div class="bkact"><button class="btn btn-gold" type="submit" id="cfok">Looks right</button><button class="btn btn-line" type="button" id="cflater">Later</button></div><p class="msg" id="cfmsg"></p></form></div>`);
  const close = () => { const m = $('#cfm'); if (m) m.remove(); };
  $('#cflater').onclick = close;
  $('#cff').onsubmit = async e => { e.preventDefault(); const F = e.target, b = $('#cfok'); b.disabled = true; say($('#cfmsg'), 'Saving…', true);
    const hours = {}; F.hours.value.split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0 && l.slice(i + 1).trim()) hours[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
    const keep = {}; (f.services || []).forEach(x => { const n = String(x).split(':')[0].trim().toLowerCase(); keep[n] = x; });
    const services = F.services.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 9).map(n => keep[n.toLowerCase()] || n);
    try { await api({ op: 'save', fields: { name: F.name.value, phone: F.phone.value, address: F.address.value, hours, services } }); D = await api({ op: 'confirm_info' }); close(); render(); }
    catch (err) { b.disabled = false; if (err.message !== 'auth') say($('#cfmsg'), 'Could not save. Try again.'); } };
}

async function load() {
  D = await api({ op: 'me' });
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#out').classList.remove('hide'); $('#menu').classList.remove('hide');
  document.body.classList.add('in');
  render();
  if (D.confirmed === false && !DEMO) showConfirm();
}
const siteCode = () => { const slug = (D.site.match(/^https?:\/\/([a-z0-9-]+)\.onewebonline\.com/) || [])[1] || ''; return slug ? (p => (p[0].slice(0, 10) + '-' + p[p.length - 1]).toUpperCase())(slug.split('-')) : ''; };
const newLeads = () => (D.bookings || []).filter(b => !b.st).length + (D.leads || []).filter(b => !b.st).length;
function go(t) { TAB = t; try { if (!DEMO) localStorage.setItem('ow_portal_tab', TAB); } catch (x) {} document.body.classList.remove('navopen'); render(); window.scrollTo(0, 0); }
function render() {
  const f = D.fields;
  $('#sbiz').textContent = f.name || 'Your website';
  $('#sstat').innerHTML = D.live ? '<span class="pill ok">Live</span>' : '<span class="pill new">Not live yet</span>';
  const nb = newLeads();

/* resize in the browser so uploads are small and fast */
function shrink(file, kind) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = kind === 'logo' ? 800 : 1800, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const png = kind === 'logo' && /png|webp|svg/.test(file.type);
      const x = c.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const type = png ? 'image/png' : 'image/jpeg';
      res({ type, data: c.toDataURL(type, 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function uploadFiles(files, kind) {
  const m = $('#pmsg'); if (!files.length) return;
  const room = kind === 'logo' ? 1 : 12 - (D.photos || []).length;
  if (room <= 0) { say(m, 'You have 12 photos already. Remove one first.'); return; }
  files = files.filter(f => /^image\//.test(f.type)).slice(0, room);
  let done = 0, failed = 0;
  for (const f of files) {
    m.className = 'msg'; m.textContent = `Uploading ${done + failed + 1} of ${files.length}...`;
    try { const s = await shrink(f, kind); const r = await api({ op: 'upload', kind, ctype: s.type, data: s.data }); if (r.ok) done++; else failed++; }
    catch (e) { if (e.message === 'auth') return; failed++; }
  }
  try { D = await api({ op: 'me' }); render(); } catch (e) {}
  say($('#pmsg'), failed ? `Uploaded ${done}, ${failed} failed. Try those again.` : `Uploaded ${done}. They're on your site now.`, !failed);
}

async function domainCheck() {
  const el = $('#dst'); if (!el) return;
  if (DEMO) { el.innerHTML = '<span class="pill new">Almost there</span> In your account we check this for you live and tell you when it\'s connected.'; return; }
  const q = async (name, type) => { const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(name)}&type=${type}`, { headers: { accept: 'application/dns-json' } }); return (await r.json()).Answer || []; };
  try {
    const c = await q('www.' + D.domain, 'CNAME');
    const pointed = c.some(a => /onewebonline\.com\.?$/i.test(a.data));
    let loads = false;
    if (pointed) { try { await fetch('https://www.' + D.domain + '/robots.txt', { mode: 'no-cors', cache: 'no-store' }); loads = true; } catch (e) {} }
    el.innerHTML = pointed && loads ? '<span class="pill ok">Connected</span> Your site is live at <a href="https://www.' + esc(D.domain) + '" target="_blank" rel="noopener">www.' + esc(D.domain) + '</a>'
      : pointed ? '<span class="pill new">Almost there</span> Your DNS is set. The secure certificate is being issued, usually within an hour.'
      : '<span class="pill bad">Not connected yet</span> The CNAME record below is missing or not showing up yet.';
  } catch (e) { el.innerHTML = '<span class="pill">Could not check right now</span>'; }
}

    <label>Owner PIN <span class="note">${R.hasPin ? '(set; type a new one to change it)' : '(4–6 digits; needed to change your schedule by phone)'}</span><input name="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="${R.hasPin ? '••••' : 'Pick a PIN'}"></label>
    <p class="note" style="margin:6px 0 0;font-size:13px">Your business hours and services come from <a href="#" data-go="site">Business info</a>.</p></div>
    ${saveBtn()}</form>

  <div class="card"><h2>Days off</h2><p class="note" style="margin-top:-6px">She won't book jobs on these days. You can also call your line from your cell, say your PIN, and tell her.</p>
    <div id="blist">${(R.blocks || []).length ? R.blocks.map((b, i) => `<div class="toggle"><span>${esc(fmtDay(b.from))}${b.to !== b.from ? ' – ' + esc(fmtDay(b.to)) : ''}<small>${esc(b.note || '')}${b.src === 'phone' ? ' · set by phone' : ''}</small></span><button type="button" class="btn btn-line btn-sm" data-rmb="${i}">Remove</button></div>`).join('') : '<p class="note">No days off coming up.</p>'}</div>
    <form id="bf" class="row" style="margin-top:12px;align-items:end"><label>From<input type="date" name="from" required></label><label>To<input type="date" name="to"></label><label style="grid-column:1/-1">Note <span class="note">(only you see this)</span><input name="note" maxlength="60" placeholder="Vacation"></label><button class="btn btn-gold" type="submit">Add days off</button></form></div>

  <div class="card"><h2>Extra minutes</h2>${u && u.consent ? `<p class="note" style="margin-top:-6px">If you go past your ${m.included} included minutes, extra minutes are $0.08 each, charged to your ${u.card === 'new' ? 'other' : 'plan'} card, never more than <b>$${u.cap}</b> a month. We text you at 80%.</p><button class="btn btn-line btn-sm" type="button" id="uoff">Turn off extra minutes</button>`
    : `<p class="note" style="margin-top:-6px">Your plan includes ${m.included} minutes a month. If you run out, she'll only take quick messages until next month. Want her to keep answering normally instead?</p>
    <div id="uflow"><button class="btn btn-gold" type="button" id="uyes">Allow extra minutes</button></div>`}</div>

  <h2 style="margin:28px 0 10px">Recent calls</h2>${(R.calls || []).length ? R.calls.map(call).join('') : '<div class="card"><p class="note">No calls yet.</p></div>'}
  ${(R.msgs || []).length ? `<h2 style="margin:28px 0 10px">Messages</h2>${R.msgs.map(x => `<div class="card" style="padding:14px 16px"><b>${x.urgent ? '🚨 ' : ''}${esc(x.name || 'Caller')}</b> <span class="note">· ${esc(fmtPhone(x.phone))} · ${new Date(x.at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><p style="margin:6px 0 0">${esc(x.msg)}</p></div>`).join('')}` : ''}`;
}
function coachView() {
  const c = COACH, keys = Object.keys(c.changes || {});
  return `<div style="border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px"><p style="margin:0 0 10px">${esc(c.reply)}</p>
    ${keys.map(k => `<div style="margin:10px 0"><div class="note" style="font-size:13px">${FIELD_NAMES[k] || k}</div><div style="white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px">${esc(k === 'jobMins' ? c.changes[k] + ' minutes' : k === 'afterHours' ? (c.changes[k] === 'message' ? 'Take a message' : 'Book the next open time') : k === 'followUp' ? (c.changes[k] === 'owner' ? 'The owner will reach out' : 'Our team will reach out') : c.changes[k])}</div></div>`).join('')}
    ${(c.refused || []).map(x => `<p class="note" style="margin:8px 0 0">⚠️ ${esc(x)}</p>`).join('')}
    <div class="bkact">${keys.length ? '<button class="btn btn-gold" type="button" id="capply">Apply</button>' : ''}<button class="btn btn-line" type="button" id="ccancel">${keys.length ? 'Cancel' : 'OK'}</button></div></div>`;
}
function bindAgents() {
  if (!RX || (!$('#nsf') && !$('#csug'))) return;
  const nsf = $('#nsf');
  if (nsf) {
    nsf.onsubmit = async e => { e.preventDefault(); const m = $('#nmsg'), area = e.target.area.value.replace(/\D/g, '');
      m.className = 'msg'; m.textContent = 'Searching…';
      try { const r = await tools({ op: 'numbers', area }); if (r.ok === false) { say(m, r.error || 'Could not search. Try again.'); return; } NUMS = { area, list: r.numbers || [] }; render(); if (r.note) say($('#nmsg'), r.note); } catch (err) { if (err.message !== 'auth') say(m, 'Could not search. Try again.'); } };
    const pk = $('#npick'); if (pk) pk.onclick = async () => { const sel = document.querySelector('[name=pick]:checked'); if (!sel) { say($('#nmsg'), 'Pick a number first.'); return; }
      pk.disabled = true; try { await rxApi({ op: 'rx_num_req', num: sel.value }); NUMS = null; render(); } catch (e) { pk.disabled = false; } };
    return;
  }
  const on = $('#rxon'); if (on) on.onchange = async () => { try { await rxApi({ op: 'rx_save', fields: { on: on.checked } }); render(); } catch (e) {} };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('#cmic');
  if (SR && mic) {
    mic.style.display = 'block'; let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
      const ta = $('#ctext'), base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
      rec.onresult = ev => { let t = ''; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; ta.value = base + t; };
      rec.onend = () => { rec = null; mic.style.background = 'var(--bg)'; mic.textContent = '🎙'; };
      rec.onerror = () => { say($('#cmsg'), 'Couldn\'t use the mic. Check that this site is allowed to use it, or type instead.'); };
      mic.style.background = '#c0392b'; mic.textContent = '■'; rec.start();
    };
  }
  $('#csug').onclick = async () => { const t = $('#ctext').value.trim(), m = $('#cmsg'); if (t.length < 3) { say(m, 'Tell her what you want changed first.'); return; }
    m.className = 'msg'; m.textContent = 'Thinking…'; $('#csug').disabled = true;
    try { const r = await tools({ op: 'coach', text: t }); if (r.ok === false) { say(m, r.error === 'plan' ? 'This is part of the AI team plan.' : (r.error || 'Could not do that. Try again.')); $('#csug').disabled = false; return; }
      COACH = Object.assign({ text: t }, r); m.textContent = ''; $('#cprop').innerHTML = coachView(); bindCoach(); $('#csug').disabled = false;
    } catch (e) { if (e.message !== 'auth') say(m, 'Could not do that. Try again.'); $('#csug').disabled = false; } };
  const un = $('#cundo'); if (un) un.onclick = async () => { if (!confirm('Undo the last change to your receptionist?')) return; try { await rxApi({ op: 'rx_undo' }); COACH = null; render(); say($('#cmsg'), 'Undone. She\'s back to how she was before the last change.', true); } catch (e) {} };
  bindCoach();
  $('#rxf').onsubmit = async e => { e.preventDefault(); const F = e.target, m = $('#smsg');
    const pin = F.pin.value.trim(); if (pin && !/^\d{4,6}$/.test(pin)) { say(m, 'The PIN needs to be 4 to 6 digits.'); return; }
    const fields = { agent: F.agent.value, jobMins: Number(F.jobMins.value), greet: F.greet.value, faq: F.faq.value, style: F.style.value, urgentWords: F.urgentWords.value,
      afterHours: F.afterHours.value, followUp: F.followUp.value, transfer: F.transfer.value, ownerPhone: F.ownerPhone.value }; if (pin) fields.pin = pin;
    m.className = 'msg'; m.textContent = 'Saving…';
    try { await rxApi({ op: 'rx_save', fields }); render(); say($('#smsg'), 'Saved. Her next call uses these settings.', true); } catch (err) { if (err.message !== 'auth') say(m, 'Could not save. Try again.'); } };
  document.querySelectorAll('[data-rmb]').forEach(b => b.onclick = async () => { const bl = RX.blocks.slice(); bl.splice(Number(b.dataset.rmb), 1); try { await rxApi({ op: 'rx_save', fields: { blocks: bl } }); render(); } catch (e) {} });
  $('#bf').onsubmit = async e => { e.preventDefault(); const F = e.target, from = F.from.value, to = F.to.value || from;
    if (to < from) { alert('The end date is before the start date.'); return; }
    try { await rxApi({ op: 'rx_save', fields: { blocks: (RX.blocks || []).concat({ from, to, note: F.note.value }) } }); render(); } catch (err) {} };
  const uy = $('#uyes'); if (uy) uy.onclick = () => {
    $('#uflow').innerHTML = `<p style="margin:0 0 10px">Use the same card you pay for your plan with?</p>
      <label class="toggle" style="cursor:pointer"><span>Yes, use the same card</span><input type="radio" name="ucard" value="same" checked></label>
      <label class="toggle" style="cursor:pointer"><span>Use a different card<small>We'll open your secure billing page to add it</small></span><input type="radio" name="ucard" value="new"></label>
      <label style="margin-top:10px">Never charge me more than<select id="ucap">${[10, 25, 50, 100, 200].map(x => `<option value="${x}" ${x === 25 ? 'selected' : ''}>$${x} a month</option>`).join('')}</select></label>
      <label class="toggle" style="margin-top:10px;cursor:pointer"><span style="font-weight:400;font-size:14px">I allow One Web to charge $0.08 per extra minute, up to my monthly limit. I can turn this off any time.</span><input type="checkbox" id="uok"></label>
      <div class="bkact"><button class="btn btn-gold" type="button" id="usave">Allow extra minutes</button><button class="btn btn-line" type="button" id="uno">Not now</button></div><p class="msg" id="umsg"></p>`;
    $('#uno').onclick = () => render();
    $('#usave').onclick = async () => { if (!$('#uok').checked) { say($('#umsg'), 'Tick the box to agree first.'); return; }
      const card = document.querySelector('[name=ucard]:checked').value;
      try { await rxApi({ op: 'rx_usage', usage: { consent: true, card, cap: Number($('#ucap').value) } });
        if (card === 'new') { const r = await api({ op: 'billing' }); if (r.url) { location.href = r.url; return; } } render(); } catch (e) {} };
  };
  const uo = $('#uoff'); if (uo) uo.onclick = async () => { if (!confirm('Turn off extra minutes? Once you use your included minutes, she\'ll only take quick messages until next month.')) return; try { await rxApi({ op: 'rx_usage', usage: { consent: false } }); render(); } catch (e) {} };
}
function bindCoach() {
  const ap = $('#capply'), cc = $('#ccancel');
  if (cc) cc.onclick = () => { COACH = null; $('#cprop').innerHTML = ''; };
  if (ap) ap.onclick = async () => { ap.disabled = true;
    try { await rxApi({ op: 'rx_save', fields: Object.assign({ _via: 'coach' }, COACH.changes) }); COACH = null; render(); $('#ctext').value = ''; say($('#cmsg'), 'Done. Her next call uses this. Call your number to hear it.', true); }
    catch (e) { ap.disabled = false; } };
}
async function demoTools(b) {
  await new Promise(r => setTimeout(r, 600));
  if (b.op === 'numbers') { const a = String(b.area || '').slice(0, 3); return /^[2-9]\d\d$/.test(a) ? { ok: true, numbers: [1, 2, 3, 4].map(i => ({ num: `+1${a}555010${i}`, pretty: `(${a}) 555-010${i}`, city: 'Sample city' })) } : { ok: false, error: 'Enter a 3-digit area code, like 212.' }; }
  return { ok: true, reply: 'Here\'s what I\'d change. (Sample account: nothing is saved.)', changes: { style: (RX.style ? RX.style + '\n' : '') + '- ' + String(b.text || '').slice(0, 200) }, refused: [] };
}
function demoRx(b) {
  const now = Date.now();
  if (!DD.rx) DD.rx = { num: '+12175550188', on: true, agent: '', greet: '', faq: 'Free estimates. We take cash, cards and Zelle.', style: '', urgentWords: '', jobMins: 60, afterHours: 'book', followUp: 'team', transfer: '', ownerPhone: '+12175550123', hasPin: true, blocks: [], usage: null, canUndo: false, hist: [],
    minutes: { used: 86, calls: 41, included: 300 }, msgs: [{ at: now - 7200e3, name: 'Dana', phone: '+12175550145', msg: 'Can you call me about a quote for a new water heater?', urgent: false }],
    calls: [{ at: now - 3600e3, from: '+12175550177', secs: 132, outcome: 'booked', summary: 'Booked a clogged kitchen sink for tomorrow at 9am.', transcript: [{ r: 'ai', t: 'Thanks for calling. How can I help you?' }, { r: 'caller', t: 'My kitchen sink is clogged.' }, { r: 'ai', t: 'Sorry about that. We can get someone out. We\'ve got today at 4pm, tomorrow at 9am, or tomorrow at 1pm. Which works best?' }, { r: 'caller', t: 'Tomorrow at 9.' }] }] };
  const R = DD.rx;
  if (b.op === 'rx_save') { R.hist.push(JSON.stringify(R)); const f = Object.assign({}, b.fields); delete f._via; if (f.pin) { R.hasPin = true; delete f.pin; } Object.assign(R, f); R.canUndo = true; }
  if (b.op === 'rx_undo' && R.hist.length) { const h = JSON.parse(R.hist.pop()); Object.assign(R, h); R.canUndo = R.hist.length > 0; }
  if (b.op === 'rx_usage') R.usage = b.usage.consent ? { consent: true, card: b.usage.card, cap: b.usage.cap } : null;
  return { ok: true, plan: 'team', rx: Object.assign({}, R) };
}

const BIND = {
  agents() { bindAgents(); },
  site() {
    $('#addh').onclick = () => { $('#hrs').insertAdjacentHTML('beforeend', hourRow('', '')); bindRm(); };
    const bindRm = () => document.querySelectorAll('[data-rmh]').forEach(b => b.onclick = () => b.parentNode.remove());
    bindRm();
    $('#sf').onsubmit = e => {
      e.preventDefault(); const F = e.target;
      const hours = {}; document.querySelectorAll('#hrs .h').forEach(r => { const d = r.querySelector('[name=hd]').value.trim(), t = r.querySelector('[name=ht]').value.trim(); if (d && t) hours[d] = t; });
      saveFields({ name: F.name.value, phone: F.phone.value, address: F.address.value, headline: F.headline.value, lead: F.lead.value,
        services: [...F.querySelectorAll('[name=svc]')].map((i, k) => { const n = i.value.trim().replace(/:/g, ' '), d = ((F.querySelectorAll('[name=svcd]')[k] || {}).value || '').trim(); return n ? (d ? n + ': ' + d : n) : ''; }).filter(Boolean), hours });
    };
  },
  look() {
    $('#lf').onsubmit = e => { e.preventDefault(); const F = e.target;
      saveFields({ brandColor: F.useColor.checked ? F.brandColor.value : '', theme: F.theme.value, fonts: F.fonts.value, hideReviews: !F.showReviews.checked, licensed: F.licensed.checked }); };
    $('#lf').addEventListener('input', e => { if (e.target.name === 'brandColor') e.target.form.useColor.checked = true; });
  },
  chat() { $('#cf').onsubmit = e => { e.preventDefault(); saveFields({ chatOn: e.target.chatOn.checked }, e.target.chatOn.checked ? 'Saved. The chat assistant is on your site.' : 'Saved. The chat assistant is off.'); }; },
  alerts() { $('#af2').onsubmit = e => { e.preventDefault(); const F = e.target, fields = { bookingOn: F.bookingOn.checked }; if (F.alertPhone.value.trim()) fields.alertPhone = F.alertPhone.value; saveFields(fields, 'Saved.'); }; },
  account() { $('#acf').onsubmit = e => { e.preventDefault(); const v = e.target.email.value.trim(); if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) { say($('#smsg'), 'Enter a valid email.'); return; } saveFields({ email: v }, 'Saved. Your next login code goes to ' + v + '.'); }; },
  photos() {
    const send = async body => { const m = $('#pmsg'); m.className = 'msg'; m.textContent = 'Saving...'; try { D = await api(Object.assign({ op: 'photos' }, body)); render(); say($('#pmsg'), 'Saved.', true); } catch (e) { if (e.message !== 'auth') say(m, 'Could not save. Try again.'); } };
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (!confirm('Remove this photo from your site?')) return; const p = D.photos.slice(); p.splice(+b.dataset.rm, 1); send({ photos: p }); });
    document.querySelectorAll('[data-main]').forEach(b => b.onclick = () => { const p = D.photos.slice(); const [x] = p.splice(+b.dataset.main, 1); p.unshift(x); send({ photos: p }); });
    const rl = $('#rmlogo'); if (rl) rl.onclick = () => { if (confirm('Remove your logo from the site?')) send({ logo: '' }); };
    $('#upp').onchange = e => uploadFiles([...e.target.files], 'photo');
    $('#upl').onchange = e => uploadFiles([...e.target.files].slice(0, 1), 'logo');
  },
  bookings() {
    document.querySelectorAll('[data-ls]').forEach(b => b.onclick = async () => {
      if (b.dataset.ls === 'delete' && !confirm('Delete this lead?')) return;
      b.disabled = true;
      try { D = await api({ op: b.dataset.k === 'chat' ? 'lead_set' : 'booking_set', at: Number(b.dataset.at), status: b.dataset.ls }); render(); } catch (e) { b.disabled = false; }
    });
  },
  reviews() {
    $('#rf').onsubmit = async e => { e.preventDefault(); const F = e.target, m = $('#rmsg'); m.className = 'msg'; m.textContent = 'Sending...';
      try { const r = await api({ op: 'review_request', name: F.name.value, email: F.email.value });
        if (r.ok === false) { const why = { email: 'That email doesn\'t look right.', nolink: 'Add your Google review link below first.', limit: 'You\'ve sent 30 today. Try again tomorrow.', dup: 'You already asked this customer in the last 30 days.' }; say(m, why[r.error] || 'Could not send. Try again.'); return; }
        D = r; render(); say($('#rmsg'), 'Sent! Thanks for asking.', true); } catch (err) { if (err.message !== 'auth') say(m, 'Could not send. Try again.'); } };
    $('#ruf').onsubmit = async e => { e.preventDefault(); try { D = await api({ op: 'save', fields: { reviewUrl: e.target.reviewUrl.value } }); render(); say($('#rmsg'), 'Review link saved.', true); } catch (err) {} };
  },
  content() {
    const f = $('#af'); if (f) f.onsubmit = async e => { e.preventDefault(); const m = $('#amsg');
      try { const r = await api({ op: 'areas_save', areas: e.target.areas.value }); CT.areas = r.areas || []; say(m, 'Saved. New town pages will follow.', true); } catch (err) { if (err.message !== 'auth') say(m, 'Could not save. Try again.'); } };
    document.querySelectorAll('[data-pp]').forEach(b => b.onclick = async () => {
      if (b.dataset.pa === 'delete' && !confirm('Remove this page from your site?')) return;
      b.disabled = true; try { await api({ op: 'post_set', post: b.dataset.pp, action: b.dataset.pa }); CT = null; render(); } catch (e) { b.disabled = false; } });
  },
  domain() {
    domainCheck(); const r = $('#recheck'); if (r) r.onclick = domainCheck;
    const f = $('#df'); if (f) f.onsubmit = async e => { e.preventDefault(); const m = $('#dmsg'); m.className = 'msg'; m.textContent = 'Connecting...';
      try { const x = await api({ op: 'domain', domain: f.domain.value }); if (x.ok === false) { say(m, 'That doesn\'t look like a domain. Try something like yourbusiness.com'); return; } D = x; render(); } catch (err) { if (err.message !== 'auth') say(m, 'Could not connect it. Try again.'); } };
  },
  billing() { bindCancel();
    const b = $('#bill'); if (!b) return;
    b.onclick = async () => { const m = $('#bmsg'); b.disabled = true; m.className = 'msg'; m.textContent = 'Opening Stripe...';
      try { const r = await api({ op: 'billing' }); if (r.url) location.href = r.url; else { say(m, DEMO ? 'In your account, this opens your secure Stripe page to update your card, get receipts or cancel.' : 'Billing is not available right now. Email hello@onewebonline.com and we will help.'); b.disabled = false; } }
      catch (e) { if (e.message !== 'auth') { say(m, 'Could not open billing. Try again.'); b.disabled = false; } } };
  },
};

(async () => { if (DEMO) { TOKEN = 'demo'; $('#out').textContent = 'Exit sample'; $('#pmain').insertAdjacentHTML('afterbegin', '<div class="card" style="margin-top:18px;border-color:var(--gold)"><b>This is a sample account.</b> <span class="note">It\'s exactly what our clients see. Click around and change anything: nothing is saved or sent, and the business and numbers are made up.</span><div class="links" style="margin:12px 0 0"><a class="btn btn-gold btn-sm" href="/#contact">Get my website</a><a class="btn btn-line btn-sm" href="/">Back to One Web</a></div></div>'); return load(); }
  if (!TOKEN) return showLogin(); try { await load(); } catch (e) { if (e.message !== 'auth') { showLogin(); say($('#lmsg'), 'Could not reach the server. Refresh to try again.'); } } })();
</script>
